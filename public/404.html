<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AURA GLOBAL — Инициализация...</title>
    <script>
      (function () {
        var path = window.location.pathname;
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        var repo = '/AURA-GLOBAL';
        
        var cleanPath = path;
        if (cleanPath.startsWith(repo)) {
          cleanPath = cleanPath.slice(repo.length);
        }
        cleanPath = cleanPath.replace(/^\/+/, '');
        
        var targetHash = '';
        if (hash) {
          targetHash = hash;
        } else if (cleanPath) {
          targetHash = '#/' + cleanPath;
        } else {
          targetHash = '#/';
        }
        
        window.location.replace(repo + '/' + targetHash + search);
      })();
    </script>
  </head>
  <body style="background-color: #07080D; color: #06B6D4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <div style="font-size: 14px; letter-spacing: 0.15em; text-transform: uppercase;">AURA GLOBAL</div>
      <div style="font-size: 12px; color: #64748B; margin-top: 8px;">Перенаправление в защищенный шлюз...</div>
    </div>
  </body>
</html>
