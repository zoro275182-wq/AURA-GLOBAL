    <script>
      // If served directly from GitHub Pages root on main branch, redirect to compiled dist
      if (window.location.hostname.includes('github.io') && !window.location.pathname.includes('/dist')) {
        var base = window.location.pathname.replace(/\/?$/, '/dist/');
        window.location.replace(base + window.location.hash);
      }
    </script>
